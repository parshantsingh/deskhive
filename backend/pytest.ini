[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
filterwarnings =
    # Daphne (third party) sets a Windows event-loop policy that Python 3.14 flags
    # as deprecated. Not ours to fix; scoped to that one message so real warnings still show.
    ignore:'asyncio..*loop.*policy.*is deprecated:DeprecationWarning
